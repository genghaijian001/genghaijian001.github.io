<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A plain personal homepage for Geng Haijian."
    />
    <title>Geng Haijian</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./workspace/render-profile.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="masthead">
        <img
          class="portrait"
          data-profile-portrait
          src=""
          alt=""
        />

        <div class="intro">
          <h1 data-profile-heading></h1>
          <p class="tagline" data-profile-tagline></p>
          <p data-profile-intro></p>
          <nav
            class="link-row"
            aria-label="Primary links"
            data-profile-links
          ></nav>
        </div>
      </header>

      <section>
        <h2>About Me</h2>
        <dl class="profile-list" data-profile-list></dl>
      </section>

      <section id="experience">
        <h2>Work Experience</h2>
        <ul class="plain-list" data-work-experience></ul>
      </section>

      <section id="education">
        <h2>Education</h2>
        <ul class="plain-list" data-education></ul>
      </section>

      <section id="academic-research" data-academic-research>
        <h2>Academic Research</h2>
        <p></p>
      </section>

      <footer>
        <p data-footer-updated></p>
      </footer>
    </main>
  </body>
</html>
